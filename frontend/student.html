<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#fffdf6"><title>我的试卷 · 学生登录</title>
  <link rel="preload" as="font" type="font/woff2" href="/css/data/fonts/HuWenMingChaoTi.woff2" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/mark-style.css"><link rel="stylesheet" href="/css/student.css">
  <script type="module" src="/js/student-login.mjs"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="login-hero">
    <section class="login-card" aria-labelledby="title">
      <div class="login-card-side">
        <p class="student-badge">PAPER · 学生专属</p>
        <h1 class="login-h1" id="title">登录 我的试卷</h1>
        <p class="login-lead">每一次作答，都值得回看。</p>
        <ul class="login-bullets">
          <li><span aria-hidden="true">📖</span> 使用自己的星立方学生账号</li>
          <li><span aria-hidden="true">🔑</span> 学生姓名或已绑定手机登录</li>
          <li><span aria-hidden="true">🧭</span> 查看本次登录的实际反馈</li>
        </ul>
        <div class="student-scope"><strong>学生登录测试</strong><p>本次先验证登录。成绩、答卷与讨论将在身份核验接通后开放。</p></div>
      </div>
      <div class="student-form-wrap">
        <form id="student-login" class="login-form" autocomplete="on">
          <div class="field"><label for="username">学生姓名 / 已绑定手机</label><input id="username" name="username" type="text" placeholder="星立方学生账号" autocomplete="username" maxlength="128" required aria-describedby="name-help"><small id="name-help">通常使用学生姓名，考号不一定是登录名。</small></div>
          <div class="field"><label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" placeholder="星立方密码" autocomplete="current-password" maxlength="256" required><button id="reveal" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div></div>
          <button class="btn btn-primary full-width" id="submit" type="submit"><span class="btn-icon" aria-hidden="true">🔑</span><span>验证登录</span></button>
          <div id="result" class="msg-box result" role="status" aria-live="polite" tabindex="-1" hidden><strong id="result-title"></strong><p id="result-detail"></p><p id="result-code" class="code"></p></div>
          <p class="login-hint">姓名和密码仅用于本次星立方登录请求。本页不保存密码，不会自动重试。</p>
          <a class="source-link" href="https://test.k12media.cn:8000/tqweb/login.jsp" target="_blank" rel="noopener noreferrer">打开星立方学生入口 ↗</a>
          <noscript><p>请启用 JavaScript，或使用上方星立方入口登录。</p></noscript>
        </form>
      </div>
    </section>
    <footer class="student-footer"><span>我的试卷 · paper.bdfz.net</span><span>反馈时只需提供提示代码，请勿发送密码。</span></footer>
  </main>
</body>
</html>
